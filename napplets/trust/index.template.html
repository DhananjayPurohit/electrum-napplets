<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>trust vendor</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e9ef; --muted:#9aa3b2;
          --accent:#f7931a; --ok:#3ddc84; --err:#ff5d5d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
              font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:8px; padding:9px 12px; background:var(--panel);
           border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { margin:0; font-size:13.5px; }
  header h1 b { color:var(--accent); }
  header span { color:var(--muted); font-size:11px; }
  main { flex:1; overflow:auto; padding:10px 12px 14px; display:flex; flex-direction:column; gap:9px; }
  footer { border-top:1px solid var(--border); padding:5px 12px; color:var(--muted); font-size:11px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:11px; padding:9px 11px; }
  .card.bad { border-color:#6b2d2d; background:#1e1416; }
  .title { font-weight:650; font-size:12.5px; }
  .sub { color:var(--muted); font-size:11px; margin-top:2px; }
  .note { color:var(--muted); font-size:11px; margin-top:5px; line-height:1.4; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--muted);
          overflow-wrap:anywhere; }
  .ok { color:var(--ok); font-size:11.5px; }
  .err { color:var(--err); font-size:11.5px; }
  .who { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill { border:1px solid var(--border); border-radius:999px; padding:0 8px; font-size:11px; }
  .pill.bad { border-color:#6b2d2d; color:var(--err); }
  .rows { display:flex; flex-direction:column; gap:5px; margin-top:6px; }
  .row { display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:8px;
         padding:5px 8px; background:#12151c; }
  .row.bad { border-color:#6b2d2d; background:#1e1416; }
  .row .grow { flex:1; min-width:0; }
  .tag { border:1px solid var(--border); border-radius:999px; padding:0 7px; font-size:10.5px; }
  .tag.ok { color:var(--ok); border-color:#2f6b45; }
  .tag.no { color:var(--err); border-color:#6b2d2d; }
  .strip { display:flex; gap:4px; flex-wrap:wrap; }
  .step { border:1px solid var(--border); border-radius:999px; padding:0 7px; font-size:10px; color:var(--muted); }
  .step.done { color:var(--ok); border-color:#2f6b45; }
  .step.now { color:#120d02; background:var(--accent); border-color:var(--accent); font-weight:650; }
  button { font:inherit; cursor:pointer; }
  .cta { width:100%; margin-top:8px; background:var(--accent); color:#140d02; border:0; border-radius:9px;
         padding:8px 10px; font-weight:650; }
  .mini { background:#12151c; color:var(--text); border:1px solid var(--border); border-radius:8px;
          padding:4px 9px; font-size:11px; }
  .log { color:var(--muted); font-size:11px; }
  .log.flash { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1><b>trust vendor</b></h1>
  <span id="roleline"></span>
</header>
<main id="app"></main>
<footer><div class="log" id="log">ready</div></footer>
__TRUST_SCRIPTS__
</body>
</html>
